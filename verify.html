
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Powered by Netlify</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#f4f9f9;
}
.nl-wrap{
  position:fixed;
  right:18px;
  bottom:18px;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  z-index:9999;
}
button{font-family:inherit;cursor:pointer}
.nl-icon-btn{
  width:30px;height:30px;
  display:flex;align-items:center;
  justify-content:center;
  border-radius:8px;
  background:transparent;
  color:#d5e3e6;
  border:0;
}
.nl-card{
  display:none;
  width:min(340px,calc(100vw - 26px));
  background:linear-gradient(180deg,#132832,#0e1e25);
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  padding:18px;
  animation:nl-rise .3s ease both;
}
.nl-card.open{display:block}
.nl-card-close{
  float:right;
}
.nl-card h2{
  margin:0;
  padding-right:25px;
  font-size:16px;
  font-weight:750;
}
.nl-card h2 em{
  font-style:normal;
  background:linear-gradient(90deg,#32e6e2,#4d7cfe,#9a6bff);
  -webkit-background-clip:text;
  color:transparent;
}
.nl-card p{
  margin:8px 0 0;
  font-size:12.5px;
  color:#d5e3e6;
}
.nl-prompt{
  position:relative;
  margin-top:14px;
  background:#10222b;
  border:1px solid rgba(255,255,255,.09);
  border-radius:14px;
  padding:10px 12px;
}
.nl-prompt textarea{
  width:100%;
  height:42px;
  resize:none;
  border:0;
  outline:none;
  background:transparent;
  color:white;
  font:inherit;
  font-size:13px;
}
.nl-send{
  position:absolute;
  right:9px;
  bottom:9px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:#05bdba;
  color:#02191b;
}
.nl-or{
  display:flex;
  align-items:center;
  gap:10px;
  margin:12px 0;
  font-size:10px;
  text-transform:uppercase;
  color:#a9bdc2;
}
.nl-or:before,.nl-or:after{
  content:"";
  flex:1;
  height:1px;
  background:rgba(255,255,255,.09);
}
.nl-drop{
  display:flex;
  justify-content:space-between;
  text-decoration:none;
  background:#1b3a45;
  border-radius:10px;
  padding:10px 12px;
  color:#cfe0e3;
  font-size:13px;
}
.nl-badge{
  display:flex;
  align-items:center;
  gap:9px;
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(180deg,#142b34,#0e1e25);
  color:white;
  border-radius:999px;
  padding:9px 14px 9px 11px;
  font-size:13px;
  font-weight:600;
}
.nl-badge-label{color:#d5e3e6}
.nl-badge-brand{font-weight:750}
@keyframes nl-rise{
  from{opacity:0;transform:translateY(10px) scale(.97)}
  to{opacity:1;transform:none}
}
@media(max-width:480px){
  .nl-wrap{right:12px;bottom:12px}
}
</style>
</head>

<body>
<div class="nl-wrap">

<section class="nl-card" id="nl-card">

<button class="nl-icon-btn nl-card-close"
id="nl-card-close" aria-label="Close">
<svg width="14" height="14" viewBox="0 0 16 16"
fill="none" stroke="currentColor" stroke-width="1.9">
<path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5"/>
</svg>
</button>

<h2><em>Build your own site with Netlify</em></h2>

<p>Describe what you want, and an AI agent designs, builds and deploys it in minutes.</p>

<form class="nl-prompt"
action="https://app.netlify.com/start"
method="get"
target="_blank">

<textarea name="prompt" rows="2"
required maxlength="300"
placeholder="A shop for my handmade surfboards…"
aria-label="Describe the site you want to build"></textarea>

<button type="submit" class="nl-send" aria-label="Build this site">
<svg width="13" height="13" viewBox="0 0 16 16"
fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M8 12.75v-9.5M3.9 7.35 8 3.25l4.1 4.1"/>
</svg>
</button>

<input type="hidden" name="utm_source" value="netlify_badge">
<input type="hidden" name="utm_campaign" value="loops">
<input type="hidden" name="utm_medium" value="owned">
<input type="hidden" name="utm_content" value="prompt">
<input type="hidden" name="utm_id"
value="f3ca3ad1-5140-497e-a063-1418eb639fd8">

</form>

<div class="nl-or"><span>or</span></div>

<a class="nl-drop"
href="https://app.netlify.com/drop?utm_source=netlify_badge&utm_campaign=loops&utm_medium=owned&utm_content=drop&utm_id=f3ca3ad1-5140-497e-a063-1418eb639fd8"
target="_blank" rel="noopener">
<span>Drop a site you already have</span>
<span>→</span>
</a>

</section>

<button class="nl-badge" id="nl-badge"
aria-expanded="false" aria-controls="nl-card">

<svg width="18" height="18" viewBox="0 0 32 32"
fill="none" aria-hidden="true">
<path fill="#fff" d="M17.9922 18.3225H14.005L13.6746 17.9921V14.005L14.005 13.6746H17.9922L18.3226 14.005V17.9921L17.9922 18.3225Z"/>
<g fill="#05BDBA">
<path d="M9.6958 24.3311H9.35705L7.6661 22.6401V22.3041L10.2511 19.7164L12.042 19.7191L12.2808 19.9552V21.7461L9.6958 24.3311Z"/>
<path d="M7.6661 9.69576V9.35701L9.35705 7.66606H9.6958L12.2808 10.2511V12.0392L12.042 12.2808H10.2511L7.6661 9.69576Z"/>
<path d="M10.0457 17.4369H0.205466L0 17.2314V14.7658L0.205466 14.5603H10.0457L10.2511 14.7658V17.2314L10.0457 17.4369Z"/>
<path d="M31.7945 17.4369H21.9544L21.7489 17.2314V14.7658L21.9544 14.5603H31.7945L32 14.7658V17.2314L31.7945 17.4369Z"/>
<path d="M14.5631 10.0456V2.66547L14.7686 2.46001H17.2343L17.4396 2.66547V10.0456L17.2343 10.2511H14.7686L14.5631 10.0456Z"/>
<path d="M14.5631 29.3316V21.9515L14.7686 21.746H17.2343L17.4396 21.9515V29.3316L17.2343 29.5371H14.7686L14.5631 29.3316Z"/>
</g>
</svg>

<span>
<span class="nl-badge-label">Powered by</span>
<span class="nl-badge-brand">Netlify</span>
</span>

</button>
</div>

<script>
const badge = document.getElementById("nl-badge");
const card = document.getElementById("nl-card");
const closeBtn = document.getElementById("nl-card-close");

function setOpen(open){
  card.classList.toggle("open",open);
  badge.setAttribute("aria-expanded",String(open));
}

badge.addEventListener("click",()=>{
  setOpen(!card.classList.contains("open"));
});

closeBtn.addEventListener("click",()=>{
  setOpen(false);
  badge.focus();
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    setOpen(false);
  }
});
</script>

</body>
</html>
